# SearXNG settings for local self-hosted search.
# Minimal override on top of the bundled defaults: JSON output for the search
# API, limiter off (single-user localhost), and secret for instance signing.
use_default_settings: true

general:
  instance_name: "AI Trainer SearXNG"
  debug: false

server:
  secret_key: "df705e24db5b41845fe8e9aeae7e633e81d04a406349156fd610855ea573b1cc"
  limiter: false
  image_proxy: false
  method: "POST"

search:
  safe_search: 0
  formats:
    - html
    - json
